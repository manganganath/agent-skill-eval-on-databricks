resources:
  dashboards:
    skill_eval_dashboard:
      display_name: Skill evaluation results
      file_path: ../src/skillhub/results/dashboard/skill_eval.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}${var.catalog_suffix}
      dataset_schema: eval
      # Viewers query with their own UC permissions, so the dashboard shows only what each user can read.
      embed_credentials: false
      # The datasets read reviewer-only views, so reviewers are the audience.
      permissions:
        - group_name: ${var.reviewers_group}
          level: CAN_RUN
