[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "skillhub"
version = "0.1.0"
description = "Agent skill registry and evaluation on Databricks"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.157.0",
  "mlflow[databricks]>=3.17.2",
  "mcp>=2.3.0",
  "openai>=3.35",
  "pydantic>=2.8",
  "pyyaml>=6",
  "typer>=0.12",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
skillhub = "skillhub.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "respx>=0.21", "httpx2>=2.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/skillhub"]  # ships every file under src/skillhub, including *.sql, *.json, *.txt (R2-30)


[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: calls Databricks; runs only with SKILLHUB_IT=1"]
